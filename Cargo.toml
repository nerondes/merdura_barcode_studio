[package]
name = "barkod_studyo"
version = "0.1.0"
edition = "2024"
description = "Sıfır C/C++ bağımlılıklı, çoklu sütun ve evrensel termal/ofis yazıcı destekli barkod etiket stüdyosu"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.31", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.31", default-features = false }
calamine = { version = "0.27", default-features = false }
csv = "1.3"
rfd = { version = "0.15", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
barcoders = { version = "2.0", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false }
ab_glyph = "0.2"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
